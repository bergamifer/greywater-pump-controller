<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>System architecture</title>
  <rect width="960" height="320" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">Architecture</text>
  <text x="30" y="60" font-size="13" fill="#475569">The safety timer runs inside the ESP32: it does not depend on WiFi or Home Assistant.</text>
  <g font-size="14" text-anchor="middle">
    <rect x="30" y="110" width="200" height="96" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="150" font-weight="700" fill="#14532d">Home Assistant</text>
    <text x="130" y="172" font-size="12" fill="#14532d">dashboard · automations</text>
    <rect x="380" y="110" width="200" height="96" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="480" y="140" font-weight="700" fill="#0c4a6e">ESP32 + ESPHome</text>
    <text x="480" y="162" font-size="12" fill="#0c4a6e">encrypted API · OTA</text>
    <text x="480" y="180" font-size="12" fill="#0c4a6e">run-time watchdog</text>
    <rect x="730" y="110" width="200" height="96" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <text x="830" y="140" font-weight="700" fill="#713f12">Relay → Pump</text>
    <text x="830" y="162" font-size="12" fill="#713f12">NO contact · fail-safe</text>
    <text x="830" y="180" font-size="12" fill="#713f12">starts OFF after an outage</text>
    <rect x="380" y="250" width="200" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="480" y="278" font-size="13" fill="#334155">Local web UI (port 80)</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M230 158 H378"/><path d="M580 158 H728"/><path d="M480 250 V208"/>
  </g>
  <text x="304" y="148" font-size="12" fill="#334155" text-anchor="middle">WiFi · encrypted API</text>
  <text x="654" y="148" font-size="12" fill="#334155" text-anchor="middle">GPIO32</text>
</svg>
