<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Wiring diagram - Greywater Pump Controller</title>
  <desc>ESP32 GPIO32 drives relay channel 1. The pump is wired to the normally-open contact, through a breaker with RCD and an optional contactor.</desc>
  <rect width="980" height="580" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">Wiring diagram</text>
  <text x="30" y="60" font-size="13" fill="#475569">Low-voltage control (left) · mains side (right, dashed red)</text>

  <!-- ESP32 -->
  <rect x="40" y="100" width="220" height="320" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="150" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">ESP32-WROOM-32U</text>
  <text x="150" y="150" text-anchor="middle" font-size="12" fill="#0c4a6e">devkit · ESPHome firmware</text>
  <g font-size="13" fill="#0c4a6e" text-anchor="start">
    <text x="60" y="200">GPIO32 · pump</text>
    <text x="60" y="240" fill="#64748b">GPIO33 · free</text>
    <text x="60" y="280" fill="#64748b">GPIO25 · free</text>
    <text x="60" y="320" fill="#64748b">GPIO26 · free</text>
    <text x="60" y="370">5V</text>
    <text x="60" y="410">GND</text>
  </g>

  <!-- Relay module -->
  <rect x="420" y="100" width="220" height="320" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="530" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">4-channel relay module</text>
  <text x="530" y="150" text-anchor="middle" font-size="12" fill="#713f12">opto-isolated, 5 V coil</text>
  <g font-size="13" fill="#713f12">
    <text x="440" y="200">IN1</text><text x="440" y="240">IN2</text>
    <text x="440" y="280">IN3</text><text x="440" y="320">IN4</text>
    <text x="440" y="370">VCC</text><text x="440" y="410">GND</text>
    <text x="620" y="190" text-anchor="end">COM1</text>
    <text x="620" y="225" text-anchor="end">NO1</text>
  </g>

  <!-- control wires -->
  <g stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M260 196 H420" stroke="#16a34a"/>
    <path d="M260 236 H420" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <path d="M260 276 H420" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <path d="M260 316 H420" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <path d="M260 366 H420" stroke="#dc2626"/>
    <path d="M260 406 H420" stroke="#0f172a"/>
  </g>
  <text x="340" y="188" text-anchor="middle" font-size="11" fill="#166534">3.3 V signal</text>
  <text x="340" y="358" text-anchor="middle" font-size="11" fill="#991b1b">+5 V</text>
  <text x="340" y="398" text-anchor="middle" font-size="11" fill="#0f172a">common GND</text>

  <!-- mains -->
  <rect x="680" y="100" width="270" height="320" rx="12" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="815" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">MAINS 230 V AC - qualified person only</text>
  <rect x="700" y="145" width="100" height="44" rx="6" fill="#fff" stroke="#991b1b" stroke-width="1.5"/>
  <text x="750" y="165" text-anchor="middle" font-size="12" fill="#991b1b">Breaker + RCD</text>
  <text x="750" y="180" text-anchor="middle" font-size="11" fill="#991b1b">(live)</text>
  <rect x="830" y="145" width="100" height="44" rx="6" fill="#fff" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="880" y="165" text-anchor="middle" font-size="12" fill="#991b1b">Contactor</text>
  <text x="880" y="180" text-anchor="middle" font-size="11" fill="#991b1b">pumps &gt; ~1/2 HP</text>

  <circle cx="815" cy="340" r="42" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="815" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">PUMP</text>
  <text x="815" y="353" text-anchor="middle" font-size="11" fill="#1e3a8a">greywater</text>

  <g stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M750 189 V225 H640" stroke="#dc2626"/>
    <path d="M640 190 H660 V260 H815 V298" stroke="#dc2626"/>
    <path d="M773 340 H700 V395 H815" stroke="#0f172a"/>
  </g>
  <text x="652" y="183" font-size="11" fill="#991b1b">live in → COM1</text>
  <text x="652" y="253" font-size="11" fill="#991b1b">NO1 → pump</text>
  <text x="705" y="412" font-size="11" fill="#0f172a">neutral / earth: not switched</text>

  <!-- notes -->
  <rect x="40" y="445" width="910" height="115" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="13" fill="#0f172a">
    <text x="58" y="472">• Pump on the normally-open (NO) contact: if control power is lost, the pump stops (fail-safe).</text>
    <text x="58" y="494">• Only the live conductor is switched. For larger pumps, the relay drives a contactor coil instead of the pump.</text>
    <text x="58" y="516">• Relay polarity assumed active-low (rele_invertido: "true"). Verify on the bench before connecting mains.</text>
    <text x="58" y="538">• Mains wiring in a closed enclosure, with RCD and breaker. Illustrative diagram, not an installation certificate.</text>
  </g>
</svg>
